<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PentaPick</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen" class="container auth-page">
    <h1>PentaPick</h1>
    <p>Tournament Betting</p>

    <div id="auth-error" class="error-msg"></div>

    <div id="signup-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="signup-username" placeholder="Pick a username" maxlength="20" autocomplete="off">
      </div>
      <div class="form-group">
        <label>4-Digit PIN</label>
        <input type="password" id="signup-pin" placeholder="1234" maxlength="4" inputmode="numeric" pattern="\d{4}">
      </div>
      <button class="btn btn-primary btn-block" onclick="doSignup()">Sign Up</button>
      <div class="auth-toggle">
        Already have an account? <a onclick="showLogin()">Log in</a>
      </div>
    </div>

    <div id="login-form" style="display:none">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="Your username" maxlength="20" autocomplete="off">
      </div>
      <div class="form-group">
        <label>4-Digit PIN</label>
        <input type="password" id="login-pin" placeholder="1234" maxlength="4" inputmode="numeric" pattern="\d{4}">
      </div>
      <button class="btn btn-primary btn-block" onclick="doLogin()">Log In</button>
      <div class="auth-toggle">
        New here? <a onclick="showSignup()">Sign up</a>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-screen" style="display:none">
    <div class="container">
      <div class="header">
        <h1>PentaPick</h1>
        <div class="points-badge" id="my-points">0 pts</div>
      </div>

      <div class="nav">
        <button class="active" onclick="switchTab('matches', this)">Matches</button>
        <button onclick="switchTab('leaderboard', this)">Leaderboard</button>
        <button onclick="switchTab('history', this)">History</button>
      </div>

      <!-- Matches Tab -->
      <div id="tab-matches"></div>

      <!-- Leaderboard Tab -->
      <div id="tab-leaderboard" style="display:none"></div>

      <!-- History Tab -->
      <div id="tab-history" style="display:none"></div>
    </div>

    <div style="text-align:center; padding: 20px;">
      <a onclick="doLogout()" style="color: var(--text2); font-size: 0.8rem; cursor:pointer;">Log out</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
